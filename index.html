<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Fraccionamiento 12%</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      color: #1f2937;
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .resultado {
      margin-top: 20px;
      padding: 15px;
      background: #eff6ff;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      color: #1e3a8a;
      display: none;
    }

    .resultado strong {
      font-size: 26px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Calculadora Fraccionamiento 12%</h1>

    <label for="monto">Ingrese el monto</label>
    <input type="number" id="monto" min="0" step="0.01" placeholder="Ejemplo: 454.73">

    <button onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado">
      12% redondeado hacia arriba:<br>
      <strong id="valor"></strong>
    </div>
  </div>

  <script>
    function calcular() {
      const monto = parseFloat(document.getElementById("monto").value);

      if (isNaN(monto) || monto < 0) {
        alert("Ingrese un monto válido.");
        return;
      }

      const porcentaje = monto * 0.12;
      const redondeado = Math.ceil(porcentaje);

      document.getElementById("valor").textContent = "S/ " + redondeado;
      document.getElementById("resultado").style.display = "block";
    }
  </script>

</body>
</html>
